name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json v$version" >&2
            exit 1
          fi
      - name: Pack plugin
        run: |
          mkdir -p out
          zip -qr "out/opencode-token-stats-gui-plugin-${GITHUB_REF_NAME}.zip" \
            package.json package-lock.json src dist vite.config.ts tsconfig.json \
            README.md README.ru.md CHANGELOG.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*.zip
